<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Logger</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1d1d1b; --muted: #6b6b66; --line: #dedbd4;
    --card: #ffffff; --ok: #4f9d69; --over: #c4574a; --short: #d8a340;
    --rest: #fbf6e4; --offc: #c4c1b9; --game-fg: #4a6fa5; --game-bg: #a8bcd8;
    --offhatch: rgba(0,0,0,.20); --rest-edge: #8d8877;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a18; --fg: #eceae4; --muted: #9a978f; --line: #34332f;
      --card: #232320; --ok: #6fbd88; --over: #e0776a; --short: #e8bb60;
      --rest: #57533f; --offc: #2f2e2a; --game-fg: #7a9fd5; --game-bg: #47597a;
      --offhatch: rgba(255,255,255,.22); --rest-edge: #a49d88;
    }
  }
  /* The same palette again, and deliberately: a rule inside a media query cannot be shared
     with one outside it, and this is what lets the theme button force dark on a machine whose
     system preference is light. Edit both blocks together. */
  :root[data-theme="dark"] {
    --bg: #1a1a18; --fg: #eceae4; --muted: #9a978f; --line: #34332f;
    --card: #232320; --ok: #6fbd88; --over: #e0776a; --short: #e8bb60;
    --rest: #57533f; --offc: #2f2e2a; --game-fg: #7a9fd5; --game-bg: #47597a;
    --offhatch: rgba(255,255,255,.22); --rest-edge: #a49d88;
  }
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0 12px 0 0; font-weight: 600; }
  /* Pushed to the far end of the header: it switches the look of the page, not the data on
     it, and standing next to the “Week” button it read as another way to change what is shown. */
  #theme { margin-left: auto; }
  button, select { background: var(--card); color: var(--fg); border: 1px solid var(--line);
                   border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
         padding: 10px 14px; min-width: 120px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-size: 20px; font-weight: 600; }
  .tracks { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
            padding: 14px; margin-bottom: 18px; }
  .track-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .track-name { width: 96px; flex: none; color: var(--muted); font-size: 12px; text-align: right; }
  .track { position: relative; height: 22px; flex: 1; background: var(--offc);
           border-radius: 4px; overflow: hidden; }
  .tracks, .heat { user-select: none; }
  .seg { position: absolute; top: 0; bottom: 0; }
  /* The regime verdict must not rely on hue alone: red/green is the most common
     colour-vision deficiency, and this track answers the report's whole question. */
  .seg.over, .bar.over { background-image: repeating-linear-gradient(45deg,
      rgba(0,0,0,.28) 0 3px, rgba(0,0,0,0) 3px 7px); }
  /* The spec's grey hatch for "PC off". Without it the regime track spends three distinct
     meanings — a real break, away time inside no block, and a machine that was not running —
     on one flat swatch, and the break the whole report is about is the one that disappears. */
  .seg.off { background-image: repeating-linear-gradient(45deg,
      var(--offhatch) 0 2px, rgba(0,0,0,0) 2px 6px); }
  /* Two neutral fills, one of them the empty track, cannot be pushed to a 3:1 luminance ratio
     without wrecking the palette. So a break is marked by shape as well as colour — the same
     answer already used for the over-limit verdict, and what 1.4.11 actually asks for: not colour alone. */
  .seg.brk { box-shadow: inset 0 0 0 1px var(--rest-edge); }
  .tracks-body { position: relative; }
  /* One overlay over the lane the tracks, the axis and the histogram all share. The 106px
     gutter is the label column, so anything positioned in here is a percentage of the day
     rather than of the card, and survives a window resize without being redrawn. */
  .lane { position: absolute; left: 106px; right: 0; top: 0; bottom: 0; pointer-events: none; }
  .grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .cursor-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--fg);
                 opacity: .55; }
  .sel-band { position: absolute; top: 0; bottom: 0; background: var(--fg); opacity: .12;
              border-left: 1px solid var(--fg); border-right: 1px solid var(--fg); }
  .tip { position: fixed; z-index: 10; pointer-events: none; max-width: 290px;
         background: var(--card); color: var(--fg); border: 1px solid var(--line);
         border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.4;
         box-shadow: 0 3px 10px rgba(0,0,0,.22); }
  .tip b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .tip .dim { color: var(--muted); }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: var(--bg); }
  .heat-row, .bar { cursor: pointer; }
  /* Absolutely positioned rather than laid out in equal flex cells: once the window can be
     zoomed, the labels no longer divide it evenly and each one has to sit at its own moment,
     in the same coordinate space as the grid line under it. */
  .axis { position: relative; height: 21px; margin-left: 106px; color: var(--muted);
          font-size: 11px; border-top: 1px solid var(--line); }
  .axis span { position: absolute; top: 4px; white-space: nowrap; }
  .zoom { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .zoom span { margin-right: auto; color: var(--muted); font-size: 12px; }
  .zoom button { padding: 2px 9px; }
  .zoom button:disabled { opacity: .45; cursor: default; }
  @media (max-width: 700px) { .axis span.dense { display: none; } }
  /* Same 106px gutter as .axis: 96px label + 10px gap. The histogram claims to share the
     tracks' clock, and starting it at the card edge stretched the same 24 hours over a wider
     box — the same timestamp landed up to 106px, about 2.4 hours, to the left. */
  #intensity { display: block; width: calc(100% - 106px); height: 48px; margin-left: 106px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
           padding: 14px; margin-bottom: 18px; }
  .scroll-x { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .off-dot { background-color: var(--offc); background-image: repeating-linear-gradient(45deg,
      var(--offhatch) 0 2px, rgba(0,0,0,0) 2px 6px); }
  .rest-dot { background-color: var(--rest); box-shadow: inset 0 0 0 1px var(--rest-edge); }
  .sliders { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 18px;
             color: var(--muted); font-size: 12px; }
  .sliders label { display: flex; align-items: center; gap: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted);
            font-size: 12px; margin-top: 10px; }
  .heat { display: grid; grid-template-columns: 70px 1fr; gap: 6px; align-items: center; }
  .heat-row { display: flex; gap: 1px; }
  .heat-cell { flex: 1; height: 16px; border-radius: 2px; }
  .heat-day { color: var(--muted); font-size: 11px; text-align: right; }
  .heat-axis { display: flex; color: var(--muted); font-size: 11px;
               border-top: 1px solid var(--line); padding-top: 4px; }
  .heat-axis span { flex: 1; }
  .bars { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .norm-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--over);
               pointer-events: none; }
  .norm-label { position: absolute; right: 0; bottom: 2px; font-size: 11px; color: var(--over);
                background: var(--card); padding: 0 4px; }
  .bars-scale { color: var(--muted); font-size: 11px; text-align: right; margin-bottom: 4px; }
  .bar { flex: 1; background-color: var(--game-fg); border-radius: 3px 3px 0 0; }
  .bar.over { background-color: var(--over); }
  .bar-labels { display: flex; gap: 6px; margin-top: 6px; }
  .bar-label { flex: 1; color: var(--muted); font-size: 11px; text-align: center; }
  .warn { border-color: var(--over); }
  .warn b { color: var(--over); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PC Logger</h1>
    <button id="prev" data-i18n-title="nav.prevDay" data-i18n-aria="nav.prevDay">←</button>
    <select id="day" data-i18n-title="nav.pickDay" data-i18n-aria="nav.pickDay"></select>
    <button id="next" data-i18n-title="nav.nextDay" data-i18n-aria="nav.nextDay">→</button>
    <button id="mode" data-i18n-title="nav.mode.tip"></button>
    <select id="lang" data-i18n-title="nav.lang.tip"></select>
    <button id="theme" data-i18n="nav.theme" data-i18n-title="nav.theme.tip"></button>
  </header>

  <div class="sliders">
    <label data-i18n-title="opt.session.tip"><span data-i18n="opt.session.label"></span> <input type="range" id="session" min="5" max="60" step="5"><b id="sessionV"></b></label>
    <label data-i18n-title="opt.break.tip"><span data-i18n="opt.break.label"></span> <input type="range" id="break" min="5" max="60" step="5"><b id="breakV"></b></label>
    <label data-i18n-title="opt.micro.tip"><span data-i18n="opt.micro.label"></span> <input type="range" id="micro" min="1" max="10" step="1"><b id="microV"></b></label>
    <label data-i18n-title="opt.tol.tip"><span data-i18n="opt.tol.label"></span> <input type="range" id="tol" min="0" max="10" step="1"><b id="tolV"></b></label>
    <label data-i18n-title="opt.norm.tip"><span data-i18n="opt.norm.label"></span> <input type="range" id="norm" min="1" max="8" step="1"><b id="normV"></b></label>
    <button id="resetOpts" data-i18n="opt.reset" data-i18n-title="opt.reset.tip"></button>
  </div>

  <div class="panel" id="selection" data-i18n-title="sel.tip"></div>

  <section id="dayView">
    <div class="panel warn hidden" id="health"></div>
    <div class="panel hidden" id="empty"></div>
    <div class="kpis" id="kpis"></div>

    <div class="tracks">
      <div class="zoom">
        <span data-i18n="zoom.hint"></span>
        <button id="zoomOut" data-i18n-title="zoom.out.tip">−</button>
        <button id="zoomIn" data-i18n-title="zoom.in.tip">+</button>
        <button id="zoomAll" data-i18n="zoom.all" data-i18n-title="zoom.all.tip"></button>
      </div>
      <div class="tracks-body" id="tracksBody">
        <div class="track-row"><div class="track-name" data-i18n="track.power.name"
             data-i18n-title="track.power.tip"></div><div class="track" id="tPower"></div></div>
        <div class="track-row"><div class="track-name" data-i18n="track.active.name"
             data-i18n-title="track.active.tip"></div><div class="track" id="tActive"></div></div>
        <div class="track-row"><div class="track-name" data-i18n="track.game.name"
             data-i18n-title="track.game.tip"></div><div class="track" id="tGame"></div></div>
        <div class="track-row"><div class="track-name" data-i18n="track.regime.name"
             data-i18n-title="track.regime.tip"></div><div class="track" id="tRegime"></div></div>
        <div class="axis" id="axis"></div>
        <svg id="intensity" preserveAspectRatio="none"></svg>
        <div class="lane" id="lane"></div>
      </div>
      <!-- Outside the lane overlay on purpose: the hour grid would otherwise be drawn
           straight through this line of text. -->
      <div class="bars-scale" data-i18n="bars.scale"></div>
      <div class="legend">
        <span data-i18n-title="legend.ok.tip"><i class="dot" style="background:var(--ok)"></i><span
              data-i18n="legend.ok"></span></span>
        <span data-i18n-title="legend.over.tip"><i class="dot" style="background:var(--over)"></i><span
              data-i18n="legend.over"></span></span>
        <span data-i18n-title="legend.short.tip"><i class="dot" style="background:var(--short)"></i><span
              data-i18n="legend.short"></span></span>
        <span data-i18n-title="legend.break.tip"><i class="dot rest-dot"></i><span
              data-i18n="legend.break"></span></span>
        <span data-i18n-title="legend.off.tip"><i class="dot off-dot"></i><span
              data-i18n="legend.off"></span></span>
        <span data-i18n-title="legend.gameFg.tip"><i class="dot" style="background:var(--game-fg)"></i><span
              data-i18n="legend.gameFg"></span></span>
        <span data-i18n-title="legend.gameBg.tip"><i class="dot" style="background:var(--game-bg)"></i><span
              data-i18n="legend.gameBg"></span></span>
      </div>
    </div>

    <div class="panel" id="games"></div>

    <div class="panel scroll-x">
      <table>
        <thead><tr>
          <th data-i18n="table.start" data-i18n-title="table.start.tip"></th>
          <th data-i18n="table.duration" data-i18n-title="table.duration.tip"></th>
          <th data-i18n="table.screen" data-i18n-title="table.screen.tip"></th>
          <th data-i18n="table.breakAfter" data-i18n-title="table.breakAfter.tip"></th>
          <th data-i18n="table.topApp" data-i18n-title="table.topApp.tip"></th>
          <th data-i18n="table.verdict" data-i18n-title="table.verdict.tip"></th>
        </tr></thead>
        <tbody id="blocks"></tbody>
      </table>
    </div>
  </section>

  <section id="weekView" class="hidden">
    <div class="kpis" id="weekKpis"></div>
    <div class="panel"><div class="heat" id="heat"></div></div>
    <div class="panel">
      <div class="bars-scale" id="barsScale"></div>
      <div class="bars" id="bars"></div>
      <div class="bar-labels" id="barLabels"></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--game-fg)"></i><span
              data-i18n="week.legend.screen"></span></span>
        <span><i class="dot" style="background:var(--over)"></i><span
              data-i18n="week.legend.violations"></span></span>
      </div>
    </div>
  </section>
</div>

<script src="i18n.js"></script>
<script src="regime.js"></script>
<script src="selection.js"></script>
<script src="render.js"></script>
<script>
const DATA = /*__DATA__*/;

Render.use(I18n);

// The language the reader chose wins over the one Windows was set to when the report was
// built: the report is a file you open, and its language belongs with the theme switch
// rather than with the collector's configuration.
const LANG_KEY = 'pclogger.lang';
I18n.set(localStorage.getItem(LANG_KEY) || DATA.lang);

function applyLang() {
  document.documentElement.lang = I18n.lang();
  applyStatic();
  applyMode(weekShown());
  fillDayPicker();   // day labels carry a weekday name; it ends with picker.value = day.from
  redraw();
  // redraw() repaints the selection panel only through draw(); drawWeek() never touches it,
  // so switching language in the week view would leave last language's numbers standing.
  if (selected) showSelection(selected.from, selected.to); else clearSelection();
}

function fillLangPicker() {
  const picker = document.getElementById('lang');
  picker.innerHTML = I18n.langs().map(function (code) {
    return '<option value="' + code + '">' + I18n.DICTS[code].$name + '</option>';
  }).join('');
  picker.value = I18n.lang();
  picker.addEventListener('change', function () {
    I18n.set(picker.value);
    localStorage.setItem(LANG_KEY, I18n.lang());
    applyLang();
  });
}

const opts = {
  sessionMinutes: DATA.defaults.session_minutes,
  breakMinutes: DATA.defaults.break_minutes,
  microGap: DATA.defaults.micro_gap,
  tolerance: DATA.defaults.tolerance,
  dayNormHours: DATA.defaults.day_norm_hours
};

const COLORS = { ok: 'var(--ok)', over: 'var(--over)', short: 'var(--short)',
                 break: 'var(--rest)',
                 fg: 'var(--game-fg)', bg: 'var(--game-bg)' };

// `day` is what the report COUNTS — the KPIs, the block table and the regime verdict are
// always the whole day. `view` is only what the lane SHOWS, and zooming moves nothing but it:
// a number that quietly changed with the wheel would stop meaning “for the day”.
let day = Render.dayBounds(DATA.generated, DATA.tz_offset_minutes);
let view = { from: day.from, to: day.to };
let regimeCache = null;
let selected = null;
let dayRange = { first: 0, last: 0 };
// The moment a drag started on, shared by the four tracks and by the cursor readout, which
// has to know whether it is reporting a point in time or a range being dragged out.
let brush = null;

// Built over the WHOLE history and only then split by day. Building it from day-filtered
// spans made a session crossing midnight into the same block twice — once on each day, each
// time with its full duration printed beside a half-day “Total at the PC”. A block belongs to the
// day it starts in, and it is counted there once.
function regimeIn(from, to) {
  if (regimeCache === null) regimeCache = Regime.buildBlocks(DATA.spans, opts);
  return Regime.blocksIn(regimeCache, from, to);
}

function fillDayPicker() {
  const picker = document.getElementById('day');
  const last = Render.dayBounds(DATA.generated, DATA.tz_offset_minutes).from;
  // Falling back to `last` rather than DATA.generated guarantees at least one option: an empty
  // database otherwise produced a picker with no options, no visible date, and — once the
  // arrows learned to clamp against the picker — a crash on the first render.
  const first = DATA.spans.length ? DATA.spans[0].t : last;
  picker.innerHTML = '';
  for (let d = last; d >= first; d -= 86400) {
    const option = document.createElement('option');
    option.value = d;
    option.textContent = new Date((d + DATA.tz_offset_minutes * 60) * 1000)
      .toISOString().slice(0, 10) + ', ' + Render.weekday(d, DATA.tz_offset_minutes);
    picker.appendChild(option);
  }
  dayRange = {
    first: picker.options.length ? Number(picker.options[picker.options.length - 1].value) : last,
    last: last
  };
  picker.value = day.from;
}

// Walking past the newest day used to leave the picker on no option at all: the header showed
// no date, everything rendered zeroes, and the only way back was an unknown number of clicks.
function goToDay(from) {
  const start = Math.min(dayRange.last, Math.max(dayRange.first, from));
  day = { from: start, to: start + 86400 };
  view = { from: day.from, to: day.to };
  document.getElementById('day').value = start;
  document.getElementById('prev').disabled = start <= dayRange.first;
  document.getElementById('next').disabled = start >= dayRange.last;
  selected = null;
  redraw();
}

function segClass(item) {
  if (item.s === 'off') return 'seg off';
  if (item.kind === 'break') return 'seg brk';
  return item.verdict === 'over' ? 'seg over' : 'seg';
}

// What each track currently shows, in paint order and clipped to the day — to the DAY, not to
// the zoom window. An unclipped duration on a segment midnight cut in half is a number the
// user cannot reconcile with what they see; but the zoom is not a boundary in the data, and
// clipping to it would tell a reader who zoomed into the middle of a block that the block is
// exactly as long as his screen, in plain contradiction of the block table.
const painted = { tPower: [], tActive: [], tGame: [], tRegime: [] };

function paint(trackId, boxes, color) {
  const track = document.getElementById(trackId);
  track.innerHTML = '';
  painted[trackId] = boxes.map(function (box) {
    const from = Math.max(box.item.t, day.from);
    const to = Math.min(box.item.t + box.item.d, day.to);
    return { t: from, d: to - from, item: box.item };
  });
  boxes.forEach(function (box) {
    const div = document.createElement('div');
    div.className = segClass(box.item);
    div.style.left = box.left + '%';
    div.style.width = box.width + '%';
    div.style.backgroundColor = color(box.item);
    track.appendChild(div);
  });
}

// The four tracks and the histogram share one clock, so the moment under the cursor is
// answered once for all of them: a line down every lane and one floating label. Without the
// line the label states a time the eye cannot transfer to the track above or below it, which
// is the whole reason to hover a timeline.

const TRACK_NAMES = { tPower: 'track.power.name', tActive: 'track.active.name',
                      tGame: 'track.game.name', tRegime: 'track.regime.name' };

const NOTHING_AT = { tPower: 'track.power.nothing', tActive: 'track.active.nothing',
                     tGame: 'track.game.nothing', tRegime: 'track.regime.nothing' };

function intensityAt(t) {
  const index = Math.floor((t - DATA.intensity.t0) / DATA.intensity.step);
  const value = DATA.intensity.v[index];
  return value == null ? 0 : value;
}

// Plain strings, written into the tooltip with textContent: `app` is the one string in this
// report that comes from the child's machine rather than from our own code.
function describeAt(zoneId, hit, t) {
  if (zoneId === 'intensity') {
    return { what: I18n.t('cursor.intensity', { pct: intensityAt(t) }) };
  }

  const name = I18n.t(TRACK_NAMES[zoneId]);
  // Today's lane runs to midnight while the data stops at the moment the report was built,
  // and “the PC was off” about eight o'clock tonight is a claim the report cannot make.
  if (!hit) {
    return { what: name + ' · ' +
      (t >= DATA.generated ? I18n.t('cursor.future') : I18n.t(NOTHING_AT[zoneId])) };
  }

  const when = clockOf(hit.t) + '–' + clockOf(hit.t + hit.d) + ' · ' +
               Render.fmtDuration(hit.d);
  const item = hit.item;
  let what;

  if (zoneId === 'tPower') what = I18n.t(item.s === 'away' ? 'cursor.away' : 'cursor.input');
  else if (zoneId === 'tActive') what = I18n.t('cursor.input');
  else if (zoneId === 'tGame') what = I18n.t(item.lvl === 'fg' ? 'cursor.game.fg' : 'cursor.game.bg',
                                             { app: item.app });
  else if (item.s === 'off') what = I18n.t('cursor.off');
  else if (item.kind === 'break') what = I18n.t('cursor.break');
  else if (item.kind === 'short') what = I18n.t('cursor.short');
  else what = I18n.t(item.verdict === 'over' ? 'cursor.block.over' : 'cursor.block.ok');

  return { what: name + ' · ' + what, when: when };
}

// Three layers, built once. The grid is refilled on every repaint because it follows the
// zoom; the band and the cursor line have to survive that refill — the band outlives a
// repaint by design, so the sliders can be moved without losing the selected evening.
function buildLane() {
  const lane = document.getElementById('lane');
  lane.innerHTML = '';
  [['grid', ''], ['selBand', 'sel-band hidden'], ['cursorLine', 'cursor-line hidden']]
    .forEach(function (pair) {
      const div = document.createElement('div');
      div.id = pair[0];
      div.className = pair[1];
      lane.appendChild(div);
    });
}

function ratioOf(t) {
  return (t - view.from) / (view.to - view.from);
}

// Also called when the day view leaves the screen: hiding the tracks fires no mouseleave, so
// without this the readout hangs over the week view, naming a moment on a lane that is gone.
function hideCursor() {
  hideTip();
  document.getElementById('cursorLine').classList.add('hidden');
}

// The wheel moves the window under a motionless pointer, and no mousemove follows it. The
// line still marks where the mouse is, but the text beside it would name a moment that is no
// longer there, so the text goes and comes back on the first pixel of movement.
function hideTip() {
  document.getElementById('tip').classList.add('hidden');
}

function showBand(from, to) {
  const band = document.getElementById('selBand');
  const window = view.to - view.from;
  const left = Math.max(0, Math.min(1, (from - view.from) / window));
  const right = Math.max(0, Math.min(1, (to - view.from) / window));
  band.classList.toggle('hidden', right <= left);
  band.style.left = (100 * left) + '%';
  band.style.width = (100 * (right - left)) + '%';
}

function hideBand() {
  document.getElementById('selBand').classList.add('hidden');
}

function enableCursorReadout() {
  const body = document.getElementById('tracksBody');
  const tip = document.createElement('div');
  tip.id = 'tip';
  tip.className = 'tip hidden';
  tip.setAttribute('aria-hidden', 'true');   // mouse-only by nature; the tables carry the same
  document.body.appendChild(tip);            // numbers for a reader who is not using one

  const place = function (event) {
    // Flipped to the other side of the cursor near the window edge, where a tooltip that
    // always opens right and down is drawn half outside the screen.
    const box = tip.getBoundingClientRect();
    const right = event.clientX + 16 + box.width > window.innerWidth;
    const below = event.clientY + 20 + box.height > window.innerHeight;
    tip.style.left = (right ? event.clientX - 16 - box.width : event.clientX + 16) + 'px';
    tip.style.top = (below ? event.clientY - 20 - box.height : event.clientY + 20) + 'px';
  };

  body.addEventListener('mousemove', function (event) {
    const track = event.target.closest('.track');
    const zone = track || event.target.closest('#intensity');
    if (!zone) return hideCursor();

    const rect = zone.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
    const t = Math.round(view.from + ratio * (view.to - view.from));
    const zoneId = track ? track.id : 'intensity';

    const line = document.getElementById('cursorLine');
    line.style.left = (100 * ratio) + '%';
    line.classList.remove('hidden');

    tip.innerHTML = '';
    const clock = document.createElement('b');
    // While the button is down the question is no longer "when is this" but "what have I
    // selected so far" — dragging a range blind and learning its bounds only on release is
    // the one thing the brush got wrong.
    clock.textContent = brush === null ? clockOf(t)
      : clockOf(Math.min(brush, t)) + ' – ' + clockOf(Math.max(brush, t)) +
        ' · ' + Render.fmtDuration(Math.abs(t - brush));
    tip.appendChild(clock);

    if (brush === null) {
      const hit = Render.itemAt(painted[zoneId] || [], t);
      const said = describeAt(zoneId, hit, t);
      tip.appendChild(document.createTextNode(said.what));
      if (said.when) {
        const dim = document.createElement('div');
        dim.className = 'dim';
        dim.textContent = said.when;
        tip.appendChild(dim);
      }
    } else {
      showBand(Math.min(brush, t), Math.max(brush, t));
      tip.appendChild(document.createTextNode(I18n.t('sel.dragging')));
    }

    tip.classList.remove('hidden');
    place(event);
  });

  body.addEventListener('mouseleave', hideCursor);
}

function drawIntensity() {
  const svg = document.getElementById('intensity');
  const minutes = Math.round((view.to - view.from) / DATA.intensity.step);
  const offset = Math.round((view.from - DATA.intensity.t0) / DATA.intensity.step);
  let path = '';
  for (let i = 0; i < minutes; i++) {
    const value = DATA.intensity.v[offset + i];
    if (value == null || value === 0) continue;
    const x = (i / minutes) * 100;
    const w = (1 / minutes) * 100;
    path += '<rect x="' + x + '" y="' + (100 - value) + '" width="' + w +
            '" height="' + value + '" fill="var(--game-fg)" opacity="0.55"/>';
  }
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.innerHTML = path;
}

// An absent bucket row means "the PC was not running", which is exactly what a healthy
// evening away from the computer looks like. Without this the parent cannot tell the two
// apart, and a broken recorder reads as perfect compliance.
function drawHealth() {
  const banner = document.getElementById('health');
  const errors = (DATA.events || []).filter(function (e) {
    return e.kind === 'error' && e.t >= day.from && e.t < day.to;
  });

  banner.classList.toggle('hidden', errors.length === 0);
  if (errors.length === 0) return;

  banner.innerHTML = '<b>' + I18n.t('health.heading') + '</b> ' + I18n.t('health.body') + '<br>' +
    errors.map(function (e) { return clockOf(e.t) + ' — ' + (e.detail || I18n.t('health.unknown')); }).join('<br>');
}

function drawEmpty(spans) {
  const note = document.getElementById('empty');
  const recorded = spans.some(function (s) { return s.s !== 'off'; });
  note.classList.toggle('hidden', recorded);
  note.textContent = I18n.t('empty.note');
}

// The axis and the grid read one tick list, so a label and the line under it can never
// disagree. Before the zoom they were two independent lists of hard-coded hours.
function drawAxis(ticks) {
  const axis = document.getElementById('axis');
  axis.innerHTML = '';
  ticks.forEach(function (t, index) {
    // A zoomed window rarely starts on a round minute, so the last tick can land almost on
    // the right edge, where its label would hang off the card.
    if (ratioOf(t) > 0.93) return;
    const span = document.createElement('span');
    span.textContent = clockOf(t);
    span.style.left = (100 * ratioOf(t)) + '%';
    // Eight labels have no room on a phone and butt into each other; CSS drops every second.
    if (index % 2 === 1) span.className = 'dense';
    axis.appendChild(span);
  });
}

function drawGrid(ticks) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ticks.forEach(function (t) {
    // A line on the window's own left edge is the track's border drawn twice.
    if (ratioOf(t) < 0.005) return;
    const line = document.createElement('div');
    line.className = 'grid-line';
    line.style.left = (100 * ratioOf(t)) + '%';
    grid.appendChild(line);
  });
}

function drawKpis(blocks, gaps, stats) {
  const breaks = gaps.filter(function (g) { return g.kind === 'break'; })
    .map(function (g) { return g.d; }).sort(function (a, b) { return a - b; });
  const middle = Math.floor(breaks.length / 2);
  const median = breaks.length === 0 ? 0
    : breaks.length % 2 ? breaks[middle]
    : (breaks[middle - 1] + breaks[middle]) / 2;
  const longest = blocks.reduce(function (max, b) { return Math.max(max, b.d); }, 0);

  const cards = [
    [I18n.t('kpi.total.label'), Render.fmtDuration(stats.active), I18n.t('kpi.total.tip')],
    [I18n.t('kpi.blocks.label'), String(blocks.length), I18n.t('kpi.blocks.tip')],
    [I18n.t('kpi.violations.label'),
     String(blocks.filter(function (b) { return b.verdict === 'over'; }).length),
     I18n.t('kpi.violations.tip')],
    [I18n.t('kpi.longest.label'), Render.fmtDuration(longest), I18n.t('kpi.longest.tip')],
    [I18n.t('kpi.median.label'), Render.fmtDuration(median), I18n.t('kpi.median.tip')]
  ];

  document.getElementById('kpis').innerHTML = cards.map(function (card) {
    return '<div class="kpi" title="' + card[2] + '"><div class="label">' + card[0] +
           '</div><div class="value">' + card[1] + '</div></div>';
  }).join('');
}

// Sums a span list over a window and returns the name with the most time, or null.
function topBy(spans, from, to, keep) {
  const totals = new Map();
  (spans || []).forEach(function (s) {
    if (keep && !keep(s)) return;
    const covered = Math.min(s.t + s.d, to) - Math.max(s.t, from);
    if (covered > 0) totals.set(s.app, (totals.get(s.app) || 0) + covered);
  });
  return totals;
}

function clockOf(ts) {
  return Render.clock(ts, DATA.tz_offset_minutes);
}

// Built through the DOM rather than by concatenating innerHTML, because `app` is the first
// string in this report that comes from the child's machine rather than from our own code.
// A filename cannot contain angle brackets on Windows, so this is defence in depth — but the
// browser side is XSS-free by construction today and it should stay that way for free.
function drawBlocksTable(blocks, gaps) {
  const body = document.getElementById('blocks');
  body.innerHTML = '';

  blocks.forEach(function (block) {
    const after = gaps.find(function (g) { return g.t === block.t + block.d; });
    const apps = topBy(DATA.app_spans, block.t, block.t + block.d);
    let top = null;
    let best = 0;
    apps.forEach(function (value, app) { if (value > best) { best = value; top = app; } });

    const row = document.createElement('tr');
    row.className = 'pick';
    row.title = I18n.t('table.row.tip');
    row.addEventListener('click', function () {
      showSelection(block.t, block.t + block.d);
    });
    [clockOf(block.t), Render.fmtDuration(block.d), Render.fmtDuration(block.screen),
     after ? Render.fmtDuration(after.d) : '—', top || '—'].forEach(function (text) {
      const td = document.createElement('td');
      td.textContent = text;
      row.appendChild(td);
    });

    const verdict = document.createElement('td');
    const dot = document.createElement('i');
    dot.className = 'dot';
    dot.style.backgroundColor = COLORS[block.verdict];
    verdict.appendChild(dot);
    verdict.appendChild(document.createTextNode(I18n.t(block.verdict === 'ok' ? 'verdict.ok' : 'verdict.over')));
    row.appendChild(verdict);

    body.appendChild(row);
  });
}

// §8.1's “games played”: the only place the report names a game. Without it the game track is
// unlabelled colour, and app_spans was payload nobody read.
function drawGamesOfDay() {
  const panel = document.getElementById('games');
  const totals = topBy(DATA.game_spans, day.from, day.to,
                       function (s) { return s.lvl === 'fg'; });

  panel.innerHTML = '';
  const title = document.createElement('b');
  title.textContent = I18n.t('games.title');
  panel.appendChild(title);

  if (totals.size === 0) {
    panel.appendChild(document.createTextNode(I18n.t('games.none')));
    return;
  }

  Array.from(totals.entries())
    .sort(function (a, b) { return b[1] - a[1]; })
    .forEach(function (entry, index) {
      if (index > 0) panel.appendChild(document.createTextNode(' · '));
      const name = document.createElement('span');
      name.textContent = entry[0];
      panel.appendChild(name);
      panel.appendChild(document.createTextNode(' — ' + Render.fmtDuration(entry[1])));
    });
}

function clearSelection() {
  selected = null;
  hideBand();
  document.getElementById('selection').innerHTML = I18n.t('sel.prompt');
}

// The selection panel is deliberately independent of the thresholds, so a repaint must restore
// it rather than delete it: the natural workflow is to select an evening and then wiggle the
// sliders to see whether the verdict holds, and that is impossible if every wiggle throws the
// selection away.
function showSelection(from, to) {
  selected = { from: from, to: to };
  const stats = Selection.stats(DATA.spans, DATA.game_spans, from, to);
  showBand(from, to);
  document.getElementById('selection').innerHTML =
    '<b>' + I18n.t('sel.heading', { from: clockOf(from), to: clockOf(to) }) + '</b> · ' +
    Render.fmtDuration(stats.total) +
    '<table><tr><td>' + I18n.t('sel.atPc') + '</td><td>' + Render.fmtDuration(stats.active) +
      '</td><td>' + stats.pct.active + ' %</td></tr>' +
    '<tr><td>' + I18n.t('sel.notAtPc') + '</td><td>' + Render.fmtDuration(stats.away + stats.off) +
      '</td><td>' + stats.pct.notAtPc + ' %</td></tr>' +
    '<tr><td>' + I18n.t('sel.away') + '</td><td>' + Render.fmtDuration(stats.away) +
      '</td><td></td></tr>' +
    '<tr><td>' + I18n.t('sel.off') + '</td><td>' + Render.fmtDuration(stats.off) +
      '</td><td></td></tr>' +
    '<tr><td>' + I18n.t('sel.gameFg') + '</td><td>' + Render.fmtDuration(stats.gameFg) +
      '</td><td>' + stats.pct.gameFg + ' %</td></tr>' +
    '<tr><td>' + I18n.t('sel.ratio') + '</td><td colspan="2">' +
      (stats.ratio === null ? '—' : stats.ratio.toFixed(1) + ' : 1') + '</td></tr></table>';
}

function enableBrush(trackId) {
  const track = document.getElementById(trackId);

  const toTime = function (event) {
    const rect = track.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
    return view.from + ratio * (view.to - view.from);
  };

  track.addEventListener('mousedown', function (event) {
    event.preventDefault();          // otherwise the drag selects the page text underneath
    brush = toTime(event);
  });
  document.addEventListener('mouseup', function (event) {
    if (brush === null) return;
    const other = toTime(event);
    const from = Math.round(Math.min(brush, other));
    const to = Math.round(Math.max(brush, other));
    brush = null;
    if (to - from >= 60) showSelection(from, to);
    else clearSelection();   // a plain click means "never mind", not "keep the old numbers
  });
}

// Everything the zoom is allowed to change, and nothing else. Kept apart from draw() so a
// wheel notch repaints four tracks and an axis instead of rebuilding the block table under
// the pointer — and so that no day-wide number can accidentally start following the window.
function drawWindow() {
  const spans = DATA.spans.filter(function (s) {
    return s.t + s.d > view.from && s.t < view.to;
  });
  // Built over the whole DAY, then clipped by layout. Asking for the blocks inside the window
  // would drop any block that started to the left of it — blocksIn selects by start — and
  // zooming into the middle of an evening would empty the regime track.
  const result = regimeIn(day.from, day.to);

  paint('tPower', Render.layout(spans.filter(function (s) { return s.s !== 'off'; }), view.from, view.to),
        function () { return 'var(--ok)'; });
  paint('tActive', Render.layout(spans.filter(function (s) { return s.s === 'active'; }), view.from, view.to),
        function () { return 'var(--game-fg)'; });
  paint('tGame', Render.layout(DATA.game_spans, view.from, view.to),
        function (item) { return COLORS[item.lvl]; });
  // Painted under the blocks: off spans say "nothing was observed here", which is a different
  // statement from "he rested". A micro pause is glued into its block by definition (§6.3), so
  // drawing it in the break colour put a break-coloured notch inside a block — at a 10-minute
  // micro setting it looks exactly like a real break.
  const regimeItems = spans.filter(function (s) { return s.s === 'off'; })
    .concat(result.blocks)
    .concat(result.gaps.filter(function (g) { return g.kind !== 'micro'; }));
  paint('tRegime', Render.layout(regimeItems, view.from, view.to),
        function (item) { return item.s === 'off' ? 'var(--offc)' : COLORS[item.verdict || item.kind]; });

  const ticks = Render.ticks(view.from, view.to, day.from);
  drawAxis(ticks);
  drawGrid(ticks);
  drawIntensity();
  // The band is stored in absolute time and clipped to the window, so a selection made at one
  // zoom level keeps pointing at the same evening at another.
  if (selected) showBand(selected.from, selected.to);

  const width = view.to - view.from;
  const whole = width >= day.to - day.from;
  document.getElementById('zoomIn').disabled = width <= Render.MIN_WINDOW;
  document.getElementById('zoomOut').disabled = whole;
  document.getElementById('zoomAll').disabled = whole;
}

// The lane takes the wheel only when it can answer it. Ctrl — ⌘ on a Mac, and also what the
// browser reports for a trackpad pinch — zooms at the cursor; a plain wheel or a two-finger
// horizontal swipe, Shift+wheel included, slides the window. A slide the lane cannot use —
// the whole day is already on screen, or the window is against midnight — is handed back to
// the page: otherwise the scroll would freeze whenever the pointer crossed the tracks.
function enableWheelZoom() {
  const body = document.getElementById('tracksBody');

  body.addEventListener('wheel', function (event) {
    const zone = event.target.closest('.track') || event.target.closest('#intensity');
    if (!zone) return;

    const rect = zone.getBoundingClientRect();
    const width = view.to - view.from;

    if (event.ctrlKey || event.metaKey) {
      // Consumed whether or not the limits allow a step: the alternative is the browser
      // zooming the whole page in the middle of a gesture aimed at the timeline.
      event.preventDefault();
      const pixels = Render.wheelPixels(event.deltaY, event.deltaMode, rect.height);
      const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      // A mouse notch of about 100 px is one quarter step; a pinch arrives as many small
      // deltas and climbs the same curve, which is why the magnitude is read and not the sign.
      view = Render.zoom(view, view.from + ratio * width, Math.pow(1.25, pixels / 100), day);
    } else {
      const pixels = Render.wheelPixels(Render.wheelAxis(event.deltaX, event.deltaY),
                                        event.deltaMode, rect.width);
      // The window follows the finger: a swipe across the whole lane moves it by its own width.
      const moved = Render.pan(view, (pixels / rect.width) * width, day);
      if (moved.from === view.from) return;
      event.preventDefault();
      view = moved;
    }

    hideTip();
    drawWindow();
  }, { passive: false });
}

// The buttons have no cursor to zoom at, so they work from the middle of the window.
function zoomBy(factor) {
  view = Render.zoom(view, (view.from + view.to) / 2, factor, day);
  hideCursor();
  drawWindow();
}

document.getElementById('zoomIn').addEventListener('click', function () { zoomBy(0.5); });
document.getElementById('zoomOut').addEventListener('click', function () { zoomBy(2); });
document.getElementById('zoomAll').addEventListener('click', function () {
  view = { from: day.from, to: day.to };
  hideCursor();
  drawWindow();
});

function draw() {
  if (selected) showSelection(selected.from, selected.to);
  else clearSelection();

  const spans = DATA.spans.filter(function (s) {
    return s.t + s.d > day.from && s.t < day.to;
  });
  const result = regimeIn(day.from, day.to);

  drawHealth();
  drawEmpty(spans);
  drawKpis(result.blocks, result.gaps, Selection.stats(spans, DATA.game_spans, day.from, day.to));
  drawBlocksTable(result.blocks, result.gaps);
  drawGamesOfDay();
  drawWindow();
}

const SLIDERS = {
  session: { opt: 'sessionMinutes', fallback: 'session_minutes' },
  break: { opt: 'breakMinutes', fallback: 'break_minutes' },
  micro: { opt: 'microGap', fallback: 'micro_gap' },
  tol: { opt: 'tolerance', fallback: 'tolerance' },
  norm: { opt: 'dayNormHours', fallback: 'day_norm_hours' }
};

function applySlider(id, value) {
  const input = document.getElementById(id);
  input.value = value;
  opts[SLIDERS[id].opt] = Number(input.value);
  document.getElementById(id + 'V').textContent = input.value;
}

Object.keys(SLIDERS).forEach(function (id) {
  applySlider(id, opts[SLIDERS[id].opt]);
  document.getElementById(id).addEventListener('input', function () {
    applySlider(id, this.value);
    regimeCache = null;
    redraw();
  });
});

// Five thresholds are easy to lose and impossible to remember: without this the only way back
// to the numbers the report was built with is to rebuild the report.
document.getElementById('resetOpts').addEventListener('click', function () {
  Object.keys(SLIDERS).forEach(function (id) {
    applySlider(id, DATA.defaults[SLIDERS[id].fallback]);
  });
  regimeCache = null;
  redraw();
});

document.getElementById('day').addEventListener('change', function (event) {
  goToDay(Number(event.target.value));
});

// In the week view the window is seven days wide, so a step of one day slides it by a seventh
// and shows almost the same week again.
function navStep() {
  return weekShown() ? WEEK_DAYS * 86400 : 86400;
}

document.getElementById('prev').addEventListener('click', function () { goToDay(day.from - navStep()); });
document.getElementById('next').addEventListener('click', function () { goToDay(day.from + navStep()); });

document.addEventListener('keydown', function (event) {
  // The sliders and the date picker own the arrows while they have focus, and moving a
  // threshold and the day at once is nobody's intention.
  const tag = (event.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (event.key === 'ArrowLeft') goToDay(day.from - navStep());
  else if (event.key === 'ArrowRight') goToDay(day.from + navStep());
  else return;
  event.preventDefault();
});

document.getElementById('theme').addEventListener('click', function () {
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') === 'dark' ||
    (!root.getAttribute('data-theme') &&
     window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
});

const WEEK_DAYS = 7;
const WEEK_SLOT_MINUTES = 30;

// “09-11 Thu”: a parent remembers that the row was a Thursday long before its date.
function dayLabel(ts) {
  return new Date((ts + DATA.tz_offset_minutes * 60) * 1000).toISOString().slice(5, 10) +
         ' ' + Render.weekday(ts, DATA.tz_offset_minutes);
}

function drawWeek() {
  const rows = Render.weekMatrix(DATA.spans, day.from, WEEK_DAYS, WEEK_SLOT_MINUTES);

  let axis = '';
  for (let hour = 0; hour < 24; hour += 3) {
    axis += '<span>' + String(hour).padStart(2, '0') + ':00</span>';
  }

  document.getElementById('heat').innerHTML = rows.map(function (row) {
    const cells = row.slots.map(function (value, index) {
      const minute = index * WEEK_SLOT_MINUTES;
      const clock = String(Math.floor(minute / 60)).padStart(2, '0') + ':' +
                    String(minute % 60).padStart(2, '0');
      return '<div class="heat-cell" title="' +
        I18n.t('week.cell.tip', { day: dayLabel(row.from), clock: clock,
                                  pct: Math.round(100 * value) }) +
        '" style="background-color:var(--game-fg);opacity:' +
        (0.08 + 0.92 * value).toFixed(2) + '"></div>';
    }).join('');
    return '<div class="heat-day">' + dayLabel(row.from) + '</div>' +
           '<div class="heat-row" data-from="' + row.from + '">' + cells + '</div>';
  }).join('') + '<div></div><div class="heat-axis">' + axis + '</div>';

  const perDay = rows.map(function (row) {
    const spans = DATA.spans.filter(function (s) {
      return s.t + s.d > row.from && s.t < row.from + 86400;
    });
    const result = regimeIn(row.from, row.from + 86400);
    return {
      from: row.from,
      screen: Selection.stats(spans, [], row.from, row.from + 86400).active,
      violations: result.blocks.filter(function (b) { return b.verdict === 'over'; }).length
    };
  });

  // Scaled against the norm as well as the peak, so the chart answers "how much" and not only
  // "which day was worst". Normalised to the peak alone, a week where the child doubled his
  // screen time looked exactly like a disciplined one.
  const norm = opts.dayNormHours * 3600;
  const peak = Math.max.apply(null, perDay.map(function (d) { return d.screen; }).concat([norm, 1]));

  document.getElementById('bars').innerHTML = perDay.map(function (d) {
    const tip = d.violations
      ? I18n.t('week.bar.tipViolations', { day: dayLabel(d.from),
                                           dur: Render.fmtDuration(d.screen), n: d.violations })
      : I18n.t('week.bar.tip', { day: dayLabel(d.from), dur: Render.fmtDuration(d.screen) });
    return '<div class="bar' + (d.violations ? ' over' : '') + '" data-from="' + d.from +
      '" style="height:' + (100 * d.screen / peak) + '%" title="' + tip + '"></div>';
  }).join('') +
    '<div class="norm-line" style="bottom:' + (100 * norm / peak) + '%">' +
    '<span class="norm-label">' + I18n.t('week.norm', { dur: Render.fmtDuration(norm) }) +
    '</span></div>';
  document.getElementById('barLabels').innerHTML = perDay.map(function (d) {
    return '<div class="bar-label">' + dayLabel(d.from) + '</div>';
  }).join('');

  // Bars are normalised to the tallest day, so the chart is unreadable in
  // absolute terms without naming what the full height stands for.
  document.getElementById('barsScale').textContent =
    I18n.t('week.fullHeight', { dur: Render.fmtDuration(peak) });

  const bad = perDay.filter(function (d) { return d.violations > 0; }).length;
  document.getElementById('weekKpis').innerHTML =
    '<div class="kpi" title="' + I18n.t('week.kpi.badDays.tip') + '"><div class="label">' +
    I18n.t('week.kpi.badDays.label') + '</div><div class="value">' +
    I18n.t('week.kpi.badDays.value', { bad: bad, total: perDay.length }) + '</div></div>' +
    '<div class="kpi" title="' + I18n.t('week.kpi.total.tip') + '"><div class="label">' +
    I18n.t('week.kpi.total.label') + '</div><div class="value">' +
    Render.fmtDuration(perDay.reduce(function (a, d) { return a + d.screen; }, 0)) +
    '</div></div>';
}

// Both views read the same spans through the same thresholds, so every control
// that changes either one has to repaint whichever view is on screen.
function redraw() {
  if (document.getElementById('weekView').classList.contains('hidden')) draw();
  else drawWeek();
}

function weekShown() {
  return !document.getElementById('weekView').classList.contains('hidden');
}

// Toggles the view without drawing it: the two callers repaint for different reasons, and
// switching to a day only to repaint the week it came from is a wasted pass over the history.
function applyMode(showWeek) {
  hideCursor();
  document.getElementById('weekView').classList.toggle('hidden', !showWeek);
  document.getElementById('dayView').classList.toggle('hidden', showWeek);
  document.getElementById('mode').textContent = I18n.t(showWeek ? 'nav.mode.day' : 'nav.mode.week');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  prev.title = I18n.t(showWeek ? 'nav.prevWeek' : 'nav.prevDay');
  next.title = I18n.t(showWeek ? 'nav.nextWeek' : 'nav.nextDay');
  prev.setAttribute('aria-label', prev.title);
  next.setAttribute('aria-label', next.title);
}

document.getElementById('mode').addEventListener('click', function () {
  applyMode(!weekShown());
  redraw();
});

// The week view used to be a dead end: it shows which day went wrong and left the reader to
// find that date in the picker by hand.
function showDay(from) {
  applyMode(false);
  goToDay(from);
}

// Delegated from the container, because drawWeek rebuilds the rows on every repaint.
function enableHeatBrush() {
  const heat = document.getElementById('heat');
  let anchor = null;
  let anchorRow = null;

  const timeIn = function (row, clientX) {
    const rect = row.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    return Number(row.dataset.from) + ratio * 86400;
  };

  heat.addEventListener('mousedown', function (event) {
    const row = event.target.closest('.heat-row');
    if (!row) return;
    event.preventDefault();
    anchorRow = row;
    anchor = timeIn(row, event.clientX);
  });

  document.addEventListener('mouseup', function (event) {
    if (anchor === null) return;
    // Dragging off the bottom of the grid clamps inside the row the drag started in, rather
    // than throwing the selection away.
    const row = (event.target.closest && event.target.closest('.heat-row')) || anchorRow;
    const other = timeIn(row, event.clientX);
    const from = Math.round(Math.min(anchor, other));
    const to = Math.round(Math.max(anchor, other));
    anchor = null;
    anchorRow = null;
    if (to - from >= 60) showSelection(from, to);
    else showDay(Number(row.dataset.from));   // a click, not a drag: open the day it points at
  });

  document.getElementById('bars').addEventListener('click', function (event) {
    const bar = event.target.closest('.bar');
    if (bar) showDay(Number(bar.dataset.from));
  });
}

// The header, the sliders, the legend, the track names and the table head are not repainted
// by redraw(), so one pass fills them — at startup and again whenever the language changes.
function applyStatic() {
  const fill = function (attribute, apply) {
    document.querySelectorAll('[' + attribute + ']').forEach(function (node) {
      apply(node, I18n.t(node.getAttribute(attribute)));
    });
  };
  fill('data-i18n', function (node, text) { node.textContent = text; });
  fill('data-i18n-title', function (node, text) { node.title = text; });
  fill('data-i18n-aria', function (node, text) { node.setAttribute('aria-label', text); });
}

['tPower', 'tActive', 'tGame', 'tRegime'].forEach(enableBrush);
enableHeatBrush();
enableWheelZoom();
buildLane();
enableCursorReadout();
applyMode(false);
document.documentElement.lang = I18n.lang();
applyStatic();
fillDayPicker();
fillLangPicker();
document.getElementById('prev').disabled = day.from <= dayRange.first;
document.getElementById('next').disabled = day.from >= dayRange.last;
draw();
</script>
</body>
